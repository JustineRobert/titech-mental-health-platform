name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
