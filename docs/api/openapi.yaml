openapi: 3.0.3
info:
  title: TITech Mental Health Platform API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
paths:
  /auth/login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: Authenticated}
        '401': {description: Invalid credentials}
  /clients:
    get:
      security: [{bearerAuth: []}]
      responses: {'200': {description: Tenant-scoped clients}}
    post:
      security: [{bearerAuth: []}]
      responses: {'201': {description: Client created}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
